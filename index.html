<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>이터널 리턴 · 3종 랜덤 룰렛</title>
<style>
:root{color-scheme:dark;font-family:Pretendard,'Noto Sans KR',system-ui,sans-serif;background:#090d18;color:#eef3ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 10%,#1a2c54 0,transparent 44%),radial-gradient(circle at 90% 100%,#271739 0,transparent 45%),#090d18;display:flex;align-items:center;justify-content:center;padding:32px 20px}.wrap{width:min(1050px,100%)}header{text-align:center;margin-bottom:33px}.eyebrow{color:#81e6d9;letter-spacing:.3em;font-size:12px;font-weight:900}h1{font-size:clamp(28px,5vw,46px);margin:9px 0 8px;letter-spacing:-.04em}header p{margin:0;color:#9aa9c4;font-size:14px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.card{min-height:270px;padding:23px 17px 20px;border:1px solid #35435b;border-radius:21px;background:linear-gradient(160deg,rgba(39,51,77,.85),rgba(14,21,38,.93));text-align:center;position:relative;overflow:hidden;box-shadow:0 12px 35px #0004}.card::before{content:'';position:absolute;inset:0 0 auto;height:3px;background:var(--accent)}.label{font-size:14px;color:#b8c5da;font-weight:800}.num{font-size:11px;color:#7d8ca5;margin-bottom:12px;letter-spacing:.14em}.display{height:135px;display:flex;justify-content:center;align-items:center;font-size:clamp(23px,3vw,36px);font-weight:900;letter-spacing:-.045em;word-break:keep-all;text-shadow:0 0 25px color-mix(in srgb,var(--accent),transparent 74%)}.display.spin{animation:flash .12s linear infinite alternate}@keyframes flash{from{opacity:.55;transform:translateY(-3px) scale(.99)}to{opacity:1;transform:translateY(3px) scale(1.04)}}.mini{border:1px solid #4c5c7a;background:#26344f;color:#e6eeff;border-radius:10px;padding:10px 18px;font-weight:800;cursor:pointer;transition:.18s}.mini:hover:not(:disabled){background:#364c71;transform:translateY(-2px)}button:disabled{opacity:.48;cursor:wait}.actions{margin:28px auto 0;text-align:center}.main{border:0;border-radius:14px;padding:17px 48px;font-size:18px;font-weight:900;color:#0b1420;background:linear-gradient(110deg,#74ebd5,#9face6);cursor:pointer;box-shadow:0 10px 30px #69d9df36;transition:.16s}.main:hover:not(:disabled){filter:brightness(1.1);transform:translateY(-2px)}.hint{text-align:center;color:#8494af;font-size:12px;margin-top:17px}.result{display:none;text-align:center;margin:22px auto 0;padding:14px 16px;background:#14243a;border:1px solid #3a6772;border-radius:12px;color:#d4fef5;max-width:720px;font-size:15px;font-weight:700}.result.show{display:block}@media(max-width:660px){.cards{grid-template-columns:1fr}.card{min-height:175px}.display{height:70px;font-size:30px}body{align-items:flex-start}header{margin-bottom:25px}.main{width:100%}}@media(prefers-reduced-motion:reduce){.display.spin{animation:none}}
</style>
</head><body>
<main class="wrap"><header><div class="eyebrow">RANDOM LOADOUT</div><h1>오늘의 운명은? 🎲</h1><p>캐릭터 · 특성 · 스펠 — 랜덤으로 조합을 결정하세요</p></header>
<section class="cards" id="cards"></section><div class="actions"><button type="button" class="main" id="all">✦ 전체 룰렛 돌리기</button></div><div class="result" id="result" aria-live="polite"></div><p class="hint">각 카드에서 개별 추첨도 가능 · 모든 항목은 동일한 확률 · 방송용 로컬 HTML</p></main>
<script>
const entries=[{title:"캐릭터",values:["니아", "매그너스", "세레스", "쇼우", "윌리엄", "이렘", "키아라", "가넷", "나딘", "나타폰", "니키", "다니엘", "다르코", "데비앤마를렌", "띠아", "라우라", "레녹스", "레니", "레온", "로지", "루치아", "루크", "르노어", "리 다이린", "리오", "마르티나", "마이", "마커스", "미르카", "바냐", "바바라", "버니스", "블레어", "비앙카", "비형", "샬럿", "셀린", "쇼이치", "수아", "슈린", "시셀라", "실비아", "아델라", "아드리아나", "아디나", "아르다", "아비게일", "아야", "아이솔", "아이작", "알렉스", "알론소", "얀", "에스텔", "에이든", "에키온", "엘레나", "엠마", "요한", "유민", "유스티나", "유키", "이바", "이슈트반", "이안", "일레븐", "자히르", "재키", "제니", "츠바메", "카밀로", "카티야", "칼라", "캐시", "케네스", "코렐라인", "크레이버", "클로에", "타지아", "테오도르", "펜리르", "펠릭스", "프리야", "피오라", "피울로", "하트", "헤이즈", "헨리", "현우", "혜진", "히스이"],color:"#79e5db"},{title:"특성",values:["취약", "흡혈마", "아드레날린", "엑셀러레이터", "스텔라 차지", "도깨비불", "벽력", "와류", "금강", "불괴", "빛의 수호", "응징", "폭발 선인장", "증폭 드론", "치유 드론", "헌신"],color:"#b79bff"},{title:"스펠",values:["블링크", "퀘이크", "프로토콜 위반", "붉은 폭풍", "초월", "아티펙트", "리펄서 미사일", "무효화", "강한 결속", "스트라이더", "진실의 칼날", "라이트 윙", "치유의 바람", "플라즈마 대시"],color:"#f5bf74"}];
const current=entries.map(()=>null),busy=[false,false,false],cards=document.querySelector('#cards'),all=document.querySelector('#all'),result=document.querySelector('#result');
entries.forEach((item,i)=>{const card=document.createElement('article');card.className='card';card.style.setProperty('--accent',item.color);card.innerHTML=`<div class="num">0${i+1} / 03</div><div class="label">${item.title}</div><div class="display" id="display-${i}" aria-live="off">???</div><button type="button" class="mini" id="roll-${i}">↻ 개별 돌리기</button>`;cards.append(card);document.getElementById('roll-'+i).addEventListener('click',()=>roll(i));});
function pick(n){return Math.floor(Math.random()*n)}function updateResult(){if(current.every(x=>x!==null)){result.textContent=`✨ 최종 조합  |  ${current.join('  +  ')}`;result.classList.add('show')}else{result.classList.remove('show')}}
function roll(i){if(busy[i])return Promise.resolve();busy[i]=true;const display=document.getElementById('display-'+i),btn=document.getElementById('roll-'+i);btn.disabled=true;all.disabled=true;result.classList.remove('show');display.classList.add('spin');return new Promise(resolve=>{let count=0;const total=17+pick(8);function tick(){display.textContent=entries[i].values[pick(entries[i].values.length)];count++;if(count<total){setTimeout(tick,45+count*8)}else{current[i]=entries[i].values[pick(entries[i].values.length)];display.textContent=current[i];display.classList.remove('spin');busy[i]=false;btn.disabled=false;if(busy.every(x=>!x))all.disabled=false;updateResult();resolve()}}tick()})}
all.addEventListener('click',async()=>{if(busy.some(Boolean))return;all.disabled=true;await Promise.all(entries.map((_,i)=>new Promise(r=>setTimeout(r,i*250)).then(()=>roll(i))));all.disabled=false});
</script></body></html>
